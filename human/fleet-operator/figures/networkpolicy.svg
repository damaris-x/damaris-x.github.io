<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -16 932 382" width="932" height="382" role="img" aria-label="A pod in another namespace is blocked both through the Service and through the node's NodePort, where its source address is still the pod's; a Mac coming in through the NodePort is let in.">
<style>
svg {
  --bg:#F5F6F8; --paper:#FFFFFF; --fg:#18202C; --muted:#5A6576; --line:#D6DBE3; --line-strong:#9AA4B3; --zone:#EEF1F5;
  --accent:#8C2B47; --accent-soft:#F3E3E8; --ok:#2B7A57; --ok-soft:#E0F0E8; --bad:#B4352C; --bad-soft:#F7E2DF;
  --warn:#9A6A12; --warn-soft:#F6ECD6; --code:#F0F2F5;
  --sans:"IBM Plex Sans","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark) { svg {
  --bg:#11151B; --paper:#171C24; --fg:#E4E8EE; --muted:#97A1B0; --line:#2B3340; --line-strong:#56606F; --zone:#1D232D;
  --accent:#E27B97; --accent-soft:#3A1F29; --ok:#5DC59A; --ok-soft:#173327; --bad:#EE7B70; --bad-soft:#3A1E1B;
  --warn:#E3B055; --warn-soft:#352915; --code:#1C222B;  } }
text { font-family:var(--sans); font-size:13px; fill:var(--fg); }
.b { font-weight:700; }
.sub { fill:var(--muted); font-size:11.5px; }
.m { font-family:var(--mono); font-size:12px; }
.tag { fill:var(--muted); font-size:11.5px; letter-spacing:0.04em; }
.lbl { font-size:12px; paint-order:stroke; stroke:var(--paper); stroke-width:5px; stroke-linejoin:round; }
.lbl.acc { fill:var(--accent); }
.lbl.bad { fill:var(--bad); }
.lbl.ok { fill:var(--ok); }
.box { fill:var(--paper); stroke:var(--line-strong); stroke-width:1.2; }
.box.acc { stroke:var(--accent); stroke-width:1.8; }
.box.dash { stroke-dasharray:5 4; }
.zone { fill:none; stroke:var(--line-strong); stroke-width:1; }
.ns { fill:var(--zone); stroke:var(--line); }
.rel { fill:none; stroke:var(--muted); stroke-dasharray:5 4; }
.ln { stroke:var(--fg); stroke-width:1.4; fill:none; }
.ln.mut { stroke:var(--line-strong); }
.ln.acc { stroke:var(--accent); stroke-width:1.8; }
.ln.bad { stroke:var(--bad); stroke-dasharray:5 4; }
.ln.ok { stroke:var(--ok); stroke-width:1.8; }
.ln.wall { stroke:var(--bad); stroke-width:1.4; stroke-dasharray:3 4; }
.mk { fill:var(--fg); } .mk.acc { fill:var(--accent); } .mk.bad { fill:var(--bad); } .mk.ok { fill:var(--ok); }
.xb { fill:var(--paper); stroke:var(--bad); stroke-width:1.6; } .xl { stroke:var(--bad); stroke-width:1.8; }
.vb { fill:var(--paper); stroke:var(--ok); stroke-width:1.6; } .vl { stroke:var(--ok); stroke-width:1.8; fill:none; }
.band-w { fill:var(--warn-soft); } .band-a { fill:var(--accent-soft); } .band-o { fill:var(--ok-soft); }
.tick { stroke:var(--line-strong); stroke-width:1; }
.axis { stroke:var(--muted); stroke-width:1.2; }
.ev { stroke:var(--fg); stroke-width:1.2; stroke-dasharray:2 3; }
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.m { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.panel { fill: var(--paper); stroke: var(--line); }
</style>
<rect class="panel" x="-15.5" y="-15.5" width="931" height="381" rx="10"/>
      <defs>
        <marker id="f5b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk bad"/></marker>
        <marker id="f5o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="mk ok"/></marker>
      </defs>
      <rect class="ns" x="600" y="20" width="280" height="310" rx="8"/>
      <text class="tag" x="616" y="42">fleet-a</text>
      <rect class="box" x="630" y="100" width="220" height="70" rx="6"/>
      <text class="b" x="740" y="130" text-anchor="middle">Fleet</text><text class="sub m" x="740" y="150" text-anchor="middle">:8080</text>
      <rect class="box" x="630" y="250" width="220" height="56" rx="6"/>
      <text class="b" x="740" y="283" text-anchor="middle">MySQL · Valkey</text>
      <text class="sub" x="616" y="200">rule 1: same namespace only</text>
      <text class="sub" x="616" y="220">rule 2: 0.0.0.0/0 except the pod CIDR</text>

      <rect class="box" x="20" y="50" width="170" height="60" rx="6"/>
      <text class="b" x="105" y="76" text-anchor="middle">pod, other namespace</text><text class="sub m" x="105" y="96" text-anchor="middle">10.244.x.x</text>
      <rect class="box" x="20" y="250" width="170" height="60" rx="6"/>
      <text class="b" x="105" y="276" text-anchor="middle">station Mac</text><text class="sub m" x="105" y="296" text-anchor="middle">LAN address</text>
      <rect class="box" x="330" y="160" width="170" height="56" rx="6"/>
      <text class="b" x="415" y="184" text-anchor="middle">node port</text><text class="sub" x="415" y="204" text-anchor="middle">NodePort</text>

      <polyline class="ln bad" points="190,70 560,70 626,109" marker-end="url(#f5b)"/>
      <text class="lbl bad" x="380" y="62" text-anchor="middle">via Service</text>
      <circle class="xb" cx="600" cy="93.5" r="9"/>
      <line class="xl" x1="595" y1="88.5" x2="605" y2="98.5"/><line class="xl" x1="605" y1="88.5" x2="595" y2="98.5"/>
      <line class="ln bad" x1="190" y1="100" x2="328" y2="174" marker-end="url(#f5b)"/>
      <text class="lbl bad" x="262" y="128" text-anchor="middle">via NodePort</text>
      <line class="ln bad" x1="500" y1="175" x2="626" y2="129" marker-end="url(#f5b)"/>
      <circle class="xb" cx="600" cy="138.3" r="9"/>
      <line class="xl" x1="595" y1="133.3" x2="605" y2="143.3"/><line class="xl" x1="605" y1="133.3" x2="595" y2="143.3"/>
      <text class="lbl bad" x="522" y="112" text-anchor="middle">source is still the pod</text>
      <line class="ln ok" x1="190" y1="270" x2="328" y2="206" marker-end="url(#f5o)"/>
      <text class="lbl ok" x="262" y="258" text-anchor="middle">Mac comes in</text>
      <line class="ln ok" x1="500" y1="205" x2="626" y2="156" marker-end="url(#f5o)"/>
      <circle class="vb" cx="600" cy="166" r="9"/>
      <polyline class="vl" points="595,166 599,170 606,161"/>
    </svg>

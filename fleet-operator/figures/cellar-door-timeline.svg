      <line class="tick" x1="192" y1="108" x2="192" y2="114"/><text class="sub m" x="192" y="130" text-anchor="middle">30</text>
      <line class="tick" x1="324" y1="108" x2="324" y2="114"/><text class="sub m" x="324" y="130" text-anchor="middle">60</text>
      <line class="tick" x1="456" y1="108" x2="456" y2="114"/><text class="sub m" x="456" y="130" text-anchor="middle">90</text>
      <line class="tick" x1="588" y1="108" x2="588" y2="114"/><text class="sub m" x="588" y="130" text-anchor="middle">120</text>
      <line class="tick" x1="720" y1="108" x2="720" y2="114"/><text class="sub m" x="720" y="130" text-anchor="middle">150</text>
      <line class="tick" x1="852" y1="108" x2="852" y2="114"/><text class="sub m" x="852" y="130" text-anchor="middle">180 s</text>
      <line class="ev" x1="60" y1="38" x2="60" y2="108"/>
      <line class="ev" x1="284.4" y1="38" x2="284.4" y2="108"/>
      <line class="ev" x1="684.8" y1="38" x2="684.8" y2="108"/>
      <text class="b" x="60" y="28">0 s cellar door stopped</text>
      <text class="b" x="284.4" y="28" text-anchor="middle">51 s failing</text>
      <text class="b" x="684.8" y="28" text-anchor="middle">142 s back</text>
    </svg>

/* Plain style, as on the home page: one serif column, default links, rules instead of boxes. */
:root {
  --bg: #FFFFFF; --fg: #000000; --muted: #444444; --rule: #888888;
  --link: #0000EE; --visited: #551A8B;
  --serif: Georgia, "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "Times New Roman", serif;
  --mono: Menlo, Consolas, "DejaVu Sans Mono", "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111111; --fg: #E6E6E6; --muted: #AAAAAA; --rule: #666666;
    --link: #8AB4F8; --visited: #C58AF9; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111111; --fg: #E6E6E6; --muted: #AAAAAA; --rule: #666666;
  --link: #8AB4F8; --visited: #C58AF9; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.75 var(--serif); }
header.site, main, footer.site {
  max-width: 40em; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header.site { padding-top: 12px; }
header.site p { margin: 0 0 4px; }
footer.site { padding-bottom: 32px; color: var(--muted); font-size: 0.9em; }
a:link { color: var(--link); }
a:visited { color: var(--visited); }
h1 { font-size: 1.7em; line-height: 1.35; margin: 0.6em 0 0.3em; }
h2 { font-size: 1.25em; line-height: 1.4; margin: 1.8em 0 0.5em; }
p, ul, ol { margin: 0 0 0.9em; }
ul, ol { padding-left: 1.6em; }
li { margin: 0 0 0.35em; }
hr { border: 0; border-top: 1px solid var(--rule); margin: 1.5em 0; }
.date { color: var(--muted); font-size: 0.9em; margin: 0 0 1.2em; }
code, pre { font-family: var(--mono); font-size: 0.86em; }
pre { margin: 0 0 0.9em; overflow-x: auto; font-size: 13px; line-height: 1.45; white-space: pre; }
.wrap { overflow-x: auto; margin: 0 0 0.9em; }
table { border-collapse: collapse; font-size: 0.9em; }
th, td { border: 1px solid var(--rule); padding: 4px 8px; text-align: left; vertical-align: top; }
blockquote { margin: 0 0 0.9em; padding-left: 1em; border-left: 1px solid var(--rule); color: var(--muted); font-size: 0.9em; }
</style>
